<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="room2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF9"/>
      <stop offset="1" stop-color="#F4EBDC"/>
    </linearGradient>
    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F2E3C8"/>
      <stop offset="0.5" stop-color="#FBF3E2"/>
      <stop offset="1" stop-color="#F2E3C8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#room2)"/>
  <rect y="640" width="1600" height="260" fill="#EAD9BC"/>
  <rect y="640" width="1600" height="10" fill="#DCC7A4"/>
  <!-- window left -->
  <g>
    <rect x="150" y="170" width="300" height="290" rx="12" fill="#DFF1FC" stroke="#0F4C81" stroke-width="9"/>
    <line x1="300" y1="170" x2="300" y2="460" stroke="#0F4C81" stroke-width="7"/>
    <circle cx="225" cy="245" r="28" fill="#FFE9A8"/>
    <polygon points="170,455 440,455 560,740 90,740" fill="#FFF6DC" opacity="0.5"/>
  </g>
  <!-- partition curtain rod + curtain (room divider) -->
  <rect x="620" y="150" width="14" height="500" rx="7" fill="#8A6B47"/>
  <rect x="600" y="128" width="54" height="20" rx="10" fill="#0F4C81"/>
  <g>
    <path d="M634 170 C 700 240 660 420 690 650 L 790 650 C 760 420 810 240 748 170 Z" fill="url(#curtain)" stroke="#D9C19B" stroke-width="4"/>
    <path d="M660 175 C 700 260 680 430 700 645" stroke="#E4D3B2" stroke-width="6" fill="none"/>
    <path d="M720 172 C 740 270 720 440 738 645" stroke="#E4D3B2" stroke-width="6" fill="none"/>
  </g>
  <!-- privacy area behind curtain -->
  <rect x="790" y="200" width="640" height="440" fill="#FBF5EA" stroke="#0F4C81" stroke-opacity="0.07" stroke-width="4"/>
  <!-- bed 1 (left of partition) -->
  <g>
    <rect x="120" y="520" width="430" height="32" rx="10" fill="#C9A97C"/>
    <rect x="120" y="440" width="430" height="88" rx="16" fill="#FFFFFF" stroke="#0F4C81" stroke-opacity="0.12" stroke-width="4"/>
    <rect x="120" y="474" width="430" height="62" rx="12" fill="#3FA173"/>
    <rect x="146" y="440" width="100" height="46" rx="12" fill="#F5B301"/>
    <rect x="108" y="428" width="36" height="132" rx="9" fill="#8A6B47"/>
  </g>
  <!-- bed 2 (right of partition) -->
  <g>
    <rect x="850" y="520" width="430" height="32" rx="10" fill="#C9A97C"/>
    <rect x="850" y="440" width="430" height="88" rx="16" fill="#FFFFFF" stroke="#0F4C81" stroke-opacity="0.12" stroke-width="4"/>
    <rect x="850" y="474" width="430" height="62" rx="12" fill="#0F4C81"/>
    <rect x="876" y="440" width="100" height="46" rx="12" fill="#F5B301"/>
    <rect x="838" y="428" width="36" height="132" rx="9" fill="#8A6B47"/>
  </g>
  <!-- wardrobe right -->
  <g>
    <rect x="1330" y="300" width="170" height="330" rx="12" fill="#F6EFE2" stroke="#C9A97C" stroke-width="5"/>
    <line x1="1415" y1="300" x2="1415" y2="630" stroke="#C9A97C" stroke-width="5"/>
    <circle cx="1400" cy="460" r="6" fill="#0F4C81"/>
    <circle cx="1430" cy="460" r="6" fill="#0F4C81"/>
  </g>
  <!-- plant -->
  <g>
    <path d="M680 620 c-6 -50 -32 -66 -48 -74 c8 38 18 60 28 74" fill="#3FA173"/>
    <path d="M686 620 c2 -54 24 -76 42 -84 c-4 40 -16 66 -26 84" fill="#2F7D5B"/>
    <rect x="656" y="616" width="62" height="58" rx="10" fill="#E8B04B"/>
  </g>
  <ellipse cx="700" cy="780" rx="280" ry="46" fill="#F5B301" opacity="0.15"/>
</svg>
