<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#BFE0F7"/>
      <stop offset="0.65" stop-color="#E8F4FC"/>
      <stop offset="1" stop-color="#FDFBF6"/>
    </linearGradient>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFDF8"/>
      <stop offset="1" stop-color="#F3E9D8"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="1340" cy="150" r="90" fill="#FFE9A8" opacity="0.9"/>
  <circle cx="1340" cy="150" r="130" fill="#FFE9A8" opacity="0.25"/>
  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.85">
    <ellipse cx="300" cy="140" rx="110" ry="34"/>
    <ellipse cx="390" cy="120" rx="80" ry="26"/>
    <ellipse cx="1050" cy="220" rx="130" ry="36"/>
    <ellipse cx="1150" cy="200" rx="80" ry="26"/>
  </g>
  <!-- ground -->
  <rect y="700" width="1600" height="200" fill="#EADFC8"/>
  <rect y="700" width="1600" height="14" fill="#DCCFB2"/>
  <!-- main building -->
  <g>
    <rect x="420" y="260" width="760" height="440" fill="url(#wall)"/>
    <rect x="420" y="260" width="760" height="440" fill="none" stroke="#0F4C81" stroke-opacity="0.12" stroke-width="4"/>
    <!-- roof band -->
    <rect x="396" y="232" width="808" height="40" rx="10" fill="#0F4C81"/>
    <rect x="396" y="272" width="808" height="12" fill="#F5B301"/>
    <!-- windows: rows -->
    <g fill="#9CCBEA" stroke="#0F4C81" stroke-width="5" stroke-opacity="0.55">
      <g>
        <rect x="470" y="320" width="90" height="110" rx="8"/><rect x="600" y="320" width="90" height="110" rx="8"/>
        <rect x="730" y="320" width="90" height="110" rx="8"/><rect x="860" y="320" width="90" height="110" rx="8"/>
        <rect x="990" y="320" width="90" height="110" rx="8"/><rect x="470" y="470" width="90" height="110" rx="8"/>
        <rect x="600" y="470" width="90" height="110" rx="8"/><rect x="860" y="470" width="90" height="110" rx="8"/>
        <rect x="990" y="470" width="90" height="110" rx="8"/><rect x="470" y="620" width="90" height="60" rx="8"/>
        <rect x="990" y="620" width="90" height="60" rx="8"/>
      </g>
    </g>
    <!-- entrance -->
    <rect x="756" y="560" width="130" height="140" rx="10" fill="#0F4C81"/>
    <rect x="770" y="574" width="102" height="126" rx="8" fill="#F5B301"/>
    <line x1="821" y1="574" x2="821" y2="700" stroke="#0F4C81" stroke-width="6"/>
    <!-- awning -->
    <rect x="726" y="530" width="190" height="26" rx="8" fill="#F5B301"/>
    <!-- signage -->
    <rect x="640" y="330" width="60" height="180" fill="#FFFFFF" opacity="0"/>
  </g>
  <!-- side wing -->
  <rect x="1180" y="420" width="240" height="280" fill="#F6EFE2" stroke="#0F4C81" stroke-opacity="0.1" stroke-width="4"/>
  <rect x="1168" y="396" width="264" height="34" rx="10" fill="#0F4C81"/>
  <g fill="#9CCBEA" stroke="#0F4C81" stroke-width="4" stroke-opacity="0.5">
    <rect x="1215" y="470" width="70" height="80" rx="6"/><rect x="1320" y="470" width="70" height="80" rx="6"/>
    <rect x="1215" y="580" width="70" height="80" rx="6"/><rect x="1320" y="580" width="70" height="80" rx="6"/>
  </g>
  <!-- palms -->
  <g stroke="#2F7D5B" stroke-width="12" stroke-linecap="round" fill="none">
    <path d="M250 720 C 245 640 255 600 270 560"/>
    <path d="M1420 740 C 1428 670 1420 630 1405 590"/>
  </g>
  <g fill="#3FA173">
    <ellipse cx="270" cy="550" rx="70" ry="22" transform="rotate(-25 270 550)"/>
    <ellipse cx="230" cy="565" rx="65" ry="20" transform="rotate(15 230 565)"/>
    <ellipse cx="300" cy="540" rx="60" ry="18" transform="rotate(40 300 540)"/>
    <ellipse cx="1405" cy="580" rx="66" ry="20" transform="rotate(25 1405 580)"/>
    <ellipse cx="1445" cy="570" rx="60" ry="18" transform="rotate(-20 1445 570)"/>
    <ellipse cx="1380" cy="595" rx="55" ry="16" transform="rotate(55 1380 595)"/>
  </g>
  <!-- soft foreground shadow -->
  <ellipse cx="800" cy="712" rx="430" ry="18" fill="#0F4C81" opacity="0.08"/>
</svg>
